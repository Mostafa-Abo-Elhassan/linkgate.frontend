    <div id="app">
        <div style="position: fixed; inset: 0; background-color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased;">

            <!-- Large Center Brand Mark -->
            <div style="position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center; margin-bottom: 28px;">
                <!-- Precision Spinner Ring -->
                <div class="product-spinner"></div>
                <!-- Embedded Logo -->
                <img src="images/LinkGate-logo.png" alt="LinkGate" style="width: 96px; height: 96px; object-fit: contain; position: relative; z-index: 1;" />
            </div>

            <!-- Clean Product Title -->
            <!--<span style="font-size: 32px; font-weight: 800; color: #0F172A; letter-spacing: -0.6px;">LinkGate</span>-->
        </div>

        <style>
            .product-spinner {
                position: absolute;
                inset: 0;
                border-radius: 50%;
                border: 4.5px solid #F1F5F9;
                border-top-color: #0077B5;
                animation: modern-spin 0.75s cubic-bezier(0.4, 0.0, 0.2, 1) infinite;
            }

            @keyframes modern-spin {
                0% {
                    transform: rotate(0deg);
                }

                100% {
                    transform: rotate(360deg);
                }
            }
        </style>
    </div>
